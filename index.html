<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB ZIM Zuganzeiger Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="brand">DB ZIM</span>
      <button id="btn-collapse" title="Sidebar umschalten">☰</button>
    </div>

    <div id="sidebar-body">
      <section class="panel">
        <h3>Anzeige</h3>
        <label>Bahnhof
          <input type="text" id="cfg-station" value="Berlin Hbf" />
        </label>
        <label>Modus
          <select id="cfg-mode">
            <option value="platform" selected>Bahnsteig / Zuganzeiger</option>
            <option value="preview">Referenzfoto-Stil</option>
          </select>
        </label>
      </section>

      <section class="panel">
        <h3>Züge</h3>
        <div id="train-editor"></div>
        <button id="btn-add-train" class="btn btn-secondary">+ Zug hinzufügen</button>
      </section>

      <section class="panel">
        <h3>Hinweis</h3>
        <label class="inline"><input type="checkbox" id="cfg-note-active" /> Hinweis aktiv</label>
        <label>Text
          <textarea id="cfg-note-text" rows="3">Bitte auf geänderte Wagenreihung achten.</textarea>
        </label>
      </section>

      <section class="panel">
        <h3>Export</h3>
        <button id="btn-fullscreen" class="btn btn-secondary">Vollbild</button>
        <button id="btn-export" class="btn btn-primary">PNG exportieren</button>
      </section>

      <p class="disclaimer">Inoffizielles Fan-Projekt. Keine Verbindung zur Deutschen Bahn oder DB InfraGO.</p>
    </div>
  </aside>

  <main id="workspace">
    <div id="display-shell">
      <div id="display-grid"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
